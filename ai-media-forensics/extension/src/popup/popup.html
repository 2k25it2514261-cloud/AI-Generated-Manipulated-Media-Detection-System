<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Forensics</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 340px;
      min-height: 200px;
      background: #070B14;
      color: #F1F5F9;
      font-family: -apple-system, 'Inter', sans-serif;
      font-size: 13px;
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(99,120,180,0.15);
    }
    .logo { font-size: 22px; }
    .title { font-size: 14px; font-weight: 700; line-height: 1.2; }
    .subtitle { font-size: 11px; color: #64748B; }
    .status-dot { width:8px; height:8px; border-radius:50%; margin-left:auto; flex-shrink:0; }
    .section { margin-bottom: 14px; }
    .section-label {
      font-size: 10px; text-transform: uppercase;
      letter-spacing: 0.1em; color: #475569;
      margin-bottom: 8px;
    }
    .url-row {
      display: flex; gap: 8px;
    }
    input[type="url"] {
      flex: 1;
      background: #0D1424;
      border: 1px solid rgba(99,120,180,0.2);
      border-radius: 8px;
      padding: 8px 10px;
      color: #F1F5F9;
      font-size: 12px;
      outline: none;
    }
    input[type="url"]:focus { border-color: #3B82F6; }
    button.primary {
      background: linear-gradient(135deg, #3B82F6, #7C3AED);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    button.primary:disabled { opacity: 0.5; cursor: not-allowed; }
    button.secondary {
      width: 100%;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(99,120,180,0.2);
      border-radius: 8px;
      padding: 9px 14px;
      color: #94A3B8;
      font-size: 12px;
      cursor: pointer;
      text-align: left;
      transition: background 0.15s;
      margin-bottom: 6px;
    }
    button.secondary:hover { background: rgba(59,130,246,0.08); color: #F1F5F9; }
    .result-card {
      background: #0D1424;
      border: 1px solid rgba(99,120,180,0.15);
      border-radius: 10px;
      padding: 12px;
      margin-top: 10px;
    }
    .score-big { font-size: 28px; font-weight: 800; }
    .verdict-badge {
      display: inline-block;
      font-size: 10px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.08em;
      padding: 2px 8px; border-radius: 100px;
      margin-top: 4px;
    }
    .pipe-row { display:flex; justify-content:space-between; padding:5px 0; font-size:11px; border-bottom:1px solid rgba(99,120,180,0.08); }
    .error { color: #F87171; font-size:12px; margin-top:8px; }
    .spinner {
      width: 16px; height: 16px;
      border: 2px solid rgba(59,130,246,0.3);
      border-top-color: #3B82F6;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: inline-block;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .toggle-row { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
    .toggle { position:relative; width:36px; height:20px; }
    .toggle input { opacity:0; width:0; height:0; }
    .slider {
      position:absolute; inset:0; background:#1E293B;
      border-radius:10px; transition:background 0.2s; cursor:pointer;
    }
    .slider::after {
      content:''; position:absolute;
      width:14px; height:14px; left:3px; top:3px;
      background:white; border-radius:50%; transition:transform 0.2s;
    }
    .toggle input:checked + .slider { background:#3B82F6; }
    .toggle input:checked + .slider::after { transform:translateX(16px); }
  </style>
</head>
<body>
  <div class="header">
    <span class="logo">🔬</span>
    <div>
      <div class="title">AI Media Forensics</div>
      <div class="subtitle">Multi-pipeline deepfake detector</div>
    </div>
    <div class="status-dot" id="statusDot" style="background:#EF4444" title="Backend status"></div>
  </div>

  <!-- Quick URL Check -->
  <div class="section">
    <div class="section-label">Analyze Image URL</div>
    <div class="url-row">
      <input type="url" id="urlInput" placeholder="https://example.com/image.jpg" />
      <button class="primary" id="analyzeBtn">Scan</button>
    </div>
    <div id="result" style="display:none"></div>
  </div>

  <!-- Settings -->
  <div class="section">
    <div class="section-label">Auto-Scan Settings</div>
    <div class="toggle-row">
      <span style="font-size:12px;color:#94A3B8">Auto-scan images on page</span>
      <label class="toggle">
        <input type="checkbox" id="autoScanToggle" />
        <span class="slider"></span>
      </label>
    </div>
    <div class="toggle-row">
      <span style="font-size:12px;color:#94A3B8">Only images ≥ 200px</span>
      <label class="toggle">
        <input type="checkbox" id="sizeFilterToggle" checked />
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <!-- Actions -->
  <div class="section">
    <div class="section-label">Actions</div>
    <button class="secondary" id="scanPageBtn">🔍 Scan all images on this page</button>
    <button class="secondary" id="openDashboardBtn">↗ Open Full Dashboard</button>
  </div>

  <div style="text-align:center; color:#334155; font-size:10px; margin-top:4px">
    AI Forensics v1.0 · <span id="backendUrl">localhost:8000</span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
